name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu-tests:
    name: CPU tests (${{ matrix.os }}, Python 3.12)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONUTF8: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      MPLBACKEND: Agg
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-lexical.txt
            requirements-lexical-plots.txt

      - name: Install CPU dependencies
        run: python -m pip install -r requirements-lexical-plots.txt

      - name: Check dependency consistency
        run: python -m pip check

      - name: Validate frozen DL2019 manifest
        run: python scripts/run_pilot.py --manifest data/pilot/dl2019.jsonl --validate-only

      - name: Run all offline tests
        run: python -m unittest discover -s tests -v

      - name: Check plotting CLI imports
        run: python scripts/plot_lexical_baseline.py --help
